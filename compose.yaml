name: challenge-funcional-health
services:
  api:
    build: .
    ports: ["127.0.0.1:4000:4000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/atm_demo
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mongo-data:
